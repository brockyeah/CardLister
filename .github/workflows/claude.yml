# @claude mention assistant: comment "@claude <ask>" on any PR or issue and
# Claude wakes up on a runner, answers or implements, and replies/pushes.
# Auth: ANTHROPIC_API_KEY repo secret + the Claude GitHub App (github.com/apps/claude).
name: Claude Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
