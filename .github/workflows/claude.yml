# @claude mention assistant: comment "@claude <ask>" on any PR or issue and
# Claude wakes up on a runner, answers or implements, and replies/pushes.
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`) — bills the
# owner's Claude subscription, not API credits — + the Claude GitHub App
# (github.com/apps/claude).
name: Claude Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
