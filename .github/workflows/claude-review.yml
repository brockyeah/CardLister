# Automatic agentic review: every PR gets a Claude review on open / new commits.
# Costs API tokens from the ANTHROPIC_API_KEY secret on each run (roughly cents
# per review, scaling with diff size).
name: Claude Auto Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior engineer. CardLister is a small
            FastAPI + SQLite + React/Vite app run by two non-expert users, so
            prioritize in this order:
            - Real bugs: logic errors, broken data flow between backend schemas
              and frontend forms, migration/schema mismatches
            - Security: auth bypasses, injection, secrets in code
            - Cost traps: anything that would silently increase Anthropic API usage
            - Skip style nits unless they hide a bug

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
