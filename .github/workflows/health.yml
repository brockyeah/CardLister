name: Production health

# Watches production from somewhere that can actually reach it.
#
# Phase 1 of the daily routine (docs/notes/daily-routine-prompt.md) pings
# /api/health itself, but that routine runs in a scheduled cloud sandbox whose
# egress proxy answers 403 to CONNECT for the Railway host. The check therefore
# could not run at all — and its failure mode was a *missing sentence* in a
# report nobody diffs, which is the worst possible shape for the one step meant
# to notice a failed deploy or a dead call-up poller. GitHub's runners have open
# egress, so the same check here fails loudly as a red scheduled run instead.
#
# The routine still attempts its own ping (when it works it is free and
# immediate); this is the copy that is guaranteed to run.

on:
  schedule:
    # Every 3 hours. The poller staleness threshold is 3 × CALLUP_POLL_MINUTES
    # (45 min at the default 15), so this samples several times per window
    # without being chatty.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health
        # Pinned rather than inherited. Without `shell:`, a `run:` block gets
        # `bash -e {0}` — so `-e` is already on and the `set` line below only
        # adds `-u` and `pipefail`, which is easy to misread when editing.
        # Naming it makes `-eo pipefail` explicit and independent of runner
        # defaults. Every command here that may legitimately exit non-zero is
        # guarded by `||` or an `if`, and all six probe outcomes were verified
        # under these flags.
        shell: bash
        env:
          # Recorded in README.md as the production URL. Kept as an env var so
          # an environment rename is a one-line change here.
          HEALTH_URL: https://cardlister-production.up.railway.app/api/health
          # Both always set (never unset — `set -u` is active), so the script
          # can compare them without a guard. DEFAULT_BRANCH can still be an
          # empty string if the event payload carries no repository object;
          # the script treats empty as "don't skip" and compares as before.
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          # --retry covers a cold container or a deploy rolling over: a single
          # refused connection is not an outage, three failures 10s apart is.
          # -w captures the status separately from the body so a 503 (which the
          # endpoint returns deliberately when the DB is unreachable) is still
          # parsed rather than discarded by --fail.
          status=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 \
            --retry-all-errors -o body.json -w '%{http_code}' "$HEALTH_URL") || {
              echo "::error::Could not reach $HEALTH_URL at all (curl exit $?)."
              echo "❌ Production health: unreachable." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          echo "HTTP $status"
          cat body.json
          echo

          if ! jq -e . body.json >/dev/null 2>&1; then
            echo "::error::/api/health returned HTTP $status with a non-JSON body."
            echo "❌ Production health: non-JSON response (HTTP $status)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Shape check before any value is trusted. The `// false` defaults
          # below are not uniformly safe: for `ok`/`db` a missing field
          # defaults to false and *fails*, but for `stale` a missing field
          # defaults to false meaning "not stale", which **passes**. So a
          # response with no `poller` object at all — a partial body, or a
          # future rename of the field — would report perfectly healthy while
          # the poller was dead. That is the fail-open this whole workflow
          # exists to escape, so an unexpected shape is a failure, never a pass.
          if ! jq -e '(.ok | type == "boolean")
                      and (.db | type == "boolean")
                      and (.poller | type == "object")
                      and (.poller.stale | type == "boolean")' body.json >/dev/null 2>&1; then
            echo "::error::/api/health did not return the expected fields (ok, db and poller.stale as booleans). The probe cannot judge health from this body, which counts as a failure rather than a pass."
            echo "❌ Production health: unexpected response shape — cannot judge health." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ok=$(jq -r '.ok' body.json)
          db=$(jq -r '.db' body.json)
          stale=$(jq -r '.poller.stale' body.json)
          # Presentational only, so a default is fine for these three — but not
          # via `//` for `enabled`. jq's alternative operator treats `false`
          # exactly like `null`, and `enabled: false` is a real, deliberate
          # state (DISABLE_CALLUP_POLLER), so `// "unknown"` would report a
          # knowingly-disabled poller as if the field were missing. This is the
          # one summary row that explains *why* alerts are not going out, so
          # collapsing those two cases defeats its purpose. Test for null.
          enabled=$(jq -r '.poller.enabled | if . == null then "unknown" else . end' body.json)
          last=$(jq -r '.poller.last_cycle_at // "never"' body.json)
          revision=$(jq -r '.revision // "unknown"' body.json)

          # Alert-delivery fields. Deliberately *not* in the hard shape check
          # above: production runs whatever Railway last deployed, so between
          # merging a change to these fields and the deploy finishing, a body
          # without them is expected and correct. Missing is therefore
          # "unknown" — reported in the summary and never a failure — while
          # missing *permanently* shows as `unknown` on run after run, the same
          # persistent-signal shape the deploy-lag warning below uses.
          #
          # `// "unknown"` is wrong for all three for the reason spelled out
          # for `enabled`: jq's alternative operator swallows `false` and `0`,
          # which are the meaningful values here — `alerts_abandoned: 0` is the
          # healthy answer and must not read as a missing field. Test for null.
          cycle_ok=$(jq -r '.poller.last_cycle_ok | if . == null then "unknown" else . end' body.json)
          pending=$(jq -r '.poller.alerts_pending | if . == null then "unknown" else . end' body.json)
          abandoned=$(jq -r '.poller.alerts_abandoned | if . == null then "unknown" else . end' body.json)

          {
            echo "### Production health"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| HTTP | \`$status\` |"
            echo "| ok / db | \`$ok\` / \`$db\` |"
            echo "| poller enabled | \`$enabled\` |"
            echo "| poller stale | \`$stale\` |"
            echo "| poller last cycle | \`$last\` |"
            echo "| last cycle ok | \`$cycle_ok\` |"
            echo "| alerts held for retry | \`$pending\` |"
            echo "| alerts abandoned unsent | \`$abandoned\` |"
            echo "| revision | \`$revision\` |"
            echo "| this run's ref | \`$REF_NAME\` @ \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          # Absent is expected (the deploy window, see above); present but
          # unparseable is not. A count that is not a number, or an ok flag
          # that is not a boolean, means something other than the app answered
          # — a proxy error page, a future rename — and this file's rule is
          # that a shape it cannot judge is a failure rather than a pass.
          # Validating here also lets the comparisons below stay plain
          # integer tests.
          for pair in "alerts_pending:$pending" "alerts_abandoned:$abandoned"; do
            case "${pair#*:}" in
              unknown) ;;
              ''|*[!0-9]*)
                echo "::error::/api/health reported poller.${pair%%:*} as '${pair#*:}', which is not a count. The probe cannot judge alert delivery from this body."
                failed=1
                ;;
            esac
          done
          case "$cycle_ok" in
            unknown|true|false) ;;
            *)
              echo "::error::/api/health reported poller.last_cycle_ok as '$cycle_ok', which is not a boolean."
              failed=1
              ;;
          esac

          if [ "$status" != "200" ]; then
            echo "::error::/api/health returned HTTP $status (expected 200; it returns 503 when the DB is unreachable)."
            failed=1
          fi

          if [ "$ok" != "true" ] || [ "$db" != "true" ]; then
            echo "::error::Health reports ok=$ok db=$db — the database is unreachable from the app."
            failed=1
          fi

          if [ "$stale" = "true" ]; then
            echo "::error::The call-up poller is stale (last cycle: $last). Call-up alerts are not being sent."
            failed=1
          fi

          # An abandoned alert is a call-up the owner was never told about and
          # never will be: it left the 48h retry window unsent, and there is no
          # path that recovers it. That is the failure this app's whole reason
          # for existing turns on, and until now it was invisible from outside
          # the container — `stale` stays false through a total mailer outage,
          # because the loop really is running. It fails the probe.
          #
          # The count is a rolling one over a ~2-day band, so it falls back to
          # zero on its own once the band moves past the abandoned event. A red
          # run here therefore clears itself; it does not need a human to reset
          # anything, only to notice.
          if [ "$abandoned" != "unknown" ] && [ "$abandoned" -gt 0 ] 2>/dev/null; then
            echo "::error::$abandoned call-up alert(s) passed the 48h retry window unsent and will never be delivered. Check the mailer credentials (SendGrid) and the Railway logs."
            failed=1
          fi

          # Held alerts and a failed cycle are warnings, not failures: both are
          # states the *next* cycle legitimately clears (a transient SMTP
          # refusal, one MLB Stats API timeout), and a check that flaps red on
          # a self-healing transient is one people learn to ignore — the same
          # reasoning as the deploy-lag warning below. What makes them worth
          # reporting at all is that neither shows up in `stale`, and either
          # one persisting across runs is the early form of the abandoned-alert
          # failure above.
          if [ "$pending" != "unknown" ] && [ "$pending" -gt 0 ] 2>/dev/null; then
            echo "::warning::$pending call-up alert(s) are held for retry — the last cycle could not email them. They are abandoned permanently if this does not clear within 48h."
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ \`$pending\` call-up alert(s) held for retry — the mailer is failing." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$cycle_ok" = "false" ]; then
            echo "::warning::The last call-up poll cycle raised an exception (the loop is still running). The alert counts beside it are from an earlier cycle. See the Railway logs."
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ The last poll cycle errored — alert counts shown are from an earlier cycle." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Deploy lag is a *warning*, not a failure. The revision only tracks
          # main once Railway finishes building, so a run that lands minutes
          # after a merge legitimately sees the old SHA — failing on that would
          # flap red on every merge and train everyone to ignore this workflow.
          # Lag that persists shows up as the same warning on run after run,
          # which is the signal worth acting on.
          #
          # Only meaningful when GITHUB_SHA *is* what production should be
          # running. A scheduled run is always on the default branch, but
          # workflow_dispatch can be fired from any ref, and comparing the
          # deployed revision against a feature branch's HEAD would warn about
          # a mismatch that is entirely expected. Skip it there and say so
          # rather than emit a warning that means nothing.
          if [ -n "$DEFAULT_BRANCH" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Deploy-lag comparison skipped: this run is on '$REF_NAME', not '$DEFAULT_BRANCH', so its SHA is not what production should be running."
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ Deploy-lag comparison skipped — run is on \`$REF_NAME\`, not \`$DEFAULT_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$revision" != "unknown" ] && [ "${GITHUB_SHA:0:7}" != "$revision" ]; then
            echo "::warning::Deployed revision $revision does not match main HEAD ${GITHUB_SHA:0:7} — a deploy may have failed, or one is still building."
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Deployed revision \`$revision\` != main HEAD \`${GITHUB_SHA:0:7}\` (still building, or the deploy failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$failed"
