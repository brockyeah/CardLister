name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the production Dockerfile
      - run: pip install -r backend/requirements.txt
      # The test suite (backend/tests + requirements-dev.txt) lands with the
      # feedback-features PR — guard so CI also passes on refs from before it.
      - name: Install dev requirements
        run: |
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
      - name: Backend tests
        run: |
          if [ -d backend/tests ]; then
            python -m pytest backend/tests -q
          else
            echo "::notice::backend/tests not on this ref yet — nothing to run"
          fi

  # Non-blocking dependency audit: surfaces new advisories on every PR / push
  # to main instead of waiting for the Monday deep pass (repo has no
  # Dependabot). continue-on-error keeps findings from ever gating a merge.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PYSEC-2026-1325 (ecdsa, transitive via python-jose): no fixed release
      # exists upstream, and the app signs JWTs with HS256 so python-jose's
      # ECDSA paths are never exercised. Tracked in docs/BACKLOG.md — drop the
      # ignore when a fixed ecdsa ships or python-jose is replaced.
      - name: pip-audit (backend requirements)
        id: pip_audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt \
            --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Bar set to high: the two known moderate react-router advisories are
      # already tracked in the backlog pending the v7 migration, and a
      # permanently-red job would train everyone to ignore it.
      - name: npm audit (frontend, high+)
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      # Annotation + summary only, no exit 1: a red X on a job that never
      # blocks anything just trains people to ignore red. The warning
      # annotation still surfaces on the PR checks page.
      - name: Flag advisories
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "::warning::Dependency audit found new advisories — see the audit job logs."
          echo "⚠️ Dependency audit found new advisories — see the audit job logs." >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend unit tests
        run: |
          if [ -f frontend/src/lib/ebayTitle.test.js ]; then
            npm test --prefix frontend
          else
            echo "::notice::frontend tests not on this ref yet — nothing to run"
          fi
      - run: npm run build
        working-directory: frontend
