name: CI
on:
  pull_request:
  push:
    branches: [main]

# Checkout-only jobs: drop the GITHUB_TOKEN from its broad defaults to
# read-only for every job (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the production Dockerfile
      - run: pip install -r backend/requirements.txt
      - run: pip install -r backend/requirements-dev.txt
      # Unconditional on purpose. These two steps used to be wrapped in
      # `if [ -f ... ]` / `if [ -d ... ]` guards, added so CI would also pass on
      # refs predating the test suite. Both conditions have been permanently
      # true for months, and they fail *open*: moving or renaming backend/tests
      # would skip the entire backend suite while CI stayed green.
      # `python -m pytest` from the repo root is required — there is no pytest
      # config, so bare `pytest` cannot resolve the `backend.` import path.
      - name: Backend tests
        run: python -m pytest backend/tests -q

  # Non-blocking dependency audit: surfaces new advisories on every PR / push
  # to main instead of waiting for the Monday deep pass (repo has no
  # Dependabot). continue-on-error keeps findings from ever gating a merge.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PYSEC-2026-1325 (ecdsa, transitive via python-jose): no fixed release
      # exists upstream, and the app signs JWTs with HS256 so python-jose's
      # ECDSA paths are never exercised. Tracked in docs/BACKLOG.md — drop the
      # ignore when a fixed ecdsa ships or python-jose is replaced.
      - name: pip-audit (backend requirements)
        id: pip_audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt \
            --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Bar set to high: the two known moderate react-router advisories are
      # already tracked in the backlog pending the v7 migration, and a
      # permanently-red job would train everyone to ignore it.
      - name: npm audit (frontend, high+)
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      # Annotation + summary only, no exit 1: a red X on a job that never
      # blocks anything just trains people to ignore red. The warning
      # annotation still surfaces on the PR checks page.
      - name: Flag advisories
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "::warning::Dependency audit found new advisories — see the audit job logs."
          echo "⚠️ Dependency audit found new advisories — see the audit job logs." >> "$GITHUB_STEP_SUMMARY"

  # Changelog housekeeping — dating a merged PR's [Unreleased] entries — is a
  # dedicated task, not something a feature PR bundles. Four separate PRs once
  # attempted the same dating for PR #59 because each routine run noticed the
  # undated heading independently; CLAUDE.md already asked them to check first,
  # and prose did not stop it. This makes the duplicate unmergeable instead.
  #
  # Only a chore/changelog-* branch may touch a dated heading, so the second and
  # third attempt go red rather than landing a conflicting date.
  changelog-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only chore/changelog-* branches may edit dated headings
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BRANCH" in
            chore/changelog-*) echo "Housekeeping branch — dated-heading edits allowed."; exit 0 ;;
          esac
          # Lines this PR adds or removes that are dated headings (## YYYY-MM-DD ...).
          touched=$(git diff "origin/$BASE...HEAD" -- CHANGELOG.md \
            | grep -E '^[-+]## 20[0-9]{2}-[0-9]{2}-[0-9]{2}' || true)
          if [ -n "$touched" ]; then
            echo "::error::This PR adds or removes a dated CHANGELOG heading:"
            echo "$touched"
            echo "Dating a merged PR's entries belongs on its own chore/changelog-<date>"
            echo "branch, and only when no such PR is already open. A feature PR that"
            echo "bundles it races every other PR doing the same thing."
            exit 1
          fi
          echo "No dated-heading edits. OK."

  # Nothing else checks the workflow files, and a broken one fails *open*. Four
  # workflows run here, two of them carrying non-trivial embedded shell —
  # health.yml is ~60 lines of bash parsing JSON with jq, and the
  # changelog-guard step below is another. A YAML typo or an unquoted expansion
  # in one of them surfaces only when that workflow next fires, and for a
  # *watchdog* workflow (health.yml) the failure mode is the worst available:
  # it silently stops reporting, which is indistinguishable from production
  # being healthy.
  #
  # actionlint covers both halves in one pass — it validates workflow schema
  # and ${{ }} expression syntax, and it runs shellcheck over every `run:`
  # block. The official image is used rather than a curl-to-bash installer so
  # the version is pinned to something auditable; it bundles the shellcheck
  # binary, without which the shell half of the check would silently no-op and
  # this job would pass while checking half of what it claims.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow schema + shellcheck over every run block)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Also unconditional: the old guard keyed on one specific test filename,
      # so renaming ebayTitle.test.js would have silently stopped the whole
      # frontend suite from running while the job stayed green.
      - name: Frontend unit tests
        run: npm test --prefix frontend
      - run: npm run build
        working-directory: frontend
