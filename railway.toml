[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# IMPORTANT: attach a Railway Volume to /data so SQLite + uploads survive redeploys.
# Then set the env var DB_PATH=/data/cardlister.db
